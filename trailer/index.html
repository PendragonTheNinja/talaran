<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Talaran Trailer</title>
<style>
  @font-face { font-family: 'Garamond'; src: url('../apps/client/public/fonts/EBGaramond-Medium.ttf'); font-weight: 500; }
  @font-face { font-family: 'Garamond'; src: url('../apps/client/public/fonts/EBGaramond-SemiBold.ttf'); font-weight: 600; }
  @font-face { font-family: 'Garamond'; src: url('../apps/client/public/fonts/EBGaramond-Bold.ttf'); font-weight: 700; }
  @font-face { font-family: 'Garamond'; src: url('../apps/client/public/fonts/EBGaramond-Italic.ttf'); font-style: italic; font-weight: 400; }
  html, body { margin: 0; background: #000; }
  canvas { display: block; width: 100vw; height: 56.25vw; max-height: 100vh; max-width: 177.78vh; margin: auto; }
  #play { position: fixed; inset: 0; display: grid; place-items: center; color: #c9a14a; font: 600 32px Garamond, serif; cursor: pointer; background: rgba(0,0,0,.6); }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<div id="play" hidden>Click to play</div>
<audio id="music" src="music-cut.mp3" preload="auto"></audio>
<script>
// Talaran launch trailer, third cut (2026-11-27).
// render(t) is a pure function of the time in seconds, so the page plays live
// (open it in a browser) and renders frame by frame (render.js). Game screens are
// real captures in the Stonehold theme (shots/, made by shoot.js; README.md).
// Music: "Celtic Impulse", Kevin MacLeod (incompetech.com), CC BY 4.0, cut on its
// own bar lines to 56 s (music-cut.mp3; README.md).

const W = 1920, H = 1080
const cv = document.getElementById('c')
const g = cv.getContext('2d')
const DURATION = 55.5

// ---- Beat grid: 144 BPM, first downbeat at 0.03 s ----------------------------
const BEAT = 0.41650, PHASE = 0.03, BAR = BEAT * 4
const bar = n => PHASE + n * BAR
const beatPulse = t => { const k = Math.floor((t - PHASE) / BEAT); return Math.exp(-(t - (PHASE + k * BEAT)) * 7) }
const barPulse = t => { const k = Math.floor((t - PHASE) / BAR); return Math.exp(-(t - (PHASE + k * BAR)) * 5) }

// ---- What is shown ----------------------------------------------------------------
const IMG = '../apps/client/public/images/'
// Real captures: [file, crop x, y, w, h] in the 1920x1080 screen.
const SHOTS = {
  main: ['main', 0, 0, 1920, 1080],
  together: ['main', 330, 776, 1265, 210],
  wood: ['wood-done', 330, 170, 1050, 520],
  mine: ['mine', 330, 170, 1050, 520],
  fish: ['fish', 330, 170, 1050, 520],
  forage: ['forage', 330, 170, 1050, 520],
  fight: ['fight', 420, 80, 840, 472],
  quank: ['quank', 700, 320, 540, 460],
  museum: ['museum', 540, 280, 870, 525],
  sloth: ['sloth', 610, 320, 710, 440],
  shops: ['shops', 600, 120, 750, 520],
  highscores: ['highscores', 1130, 80, 786, 760],
  islandmap: ['islandmap', 480, 68, 960, 960],
  gear: ['main', 20, 20, 290, 640],
}
const SKILL_FLASH = [
  ['Woodcutting', 'shot', 'wood'], ['Mining', 'shot', 'mine'], ['Fishing', 'shot', 'fish'], ['Foraging', 'shot', 'forage'],
  ['Hunting', 'card', ['Lanai_Hunting_Bow', 'Deerhide', 'Ambren_Arrow']], ['Melee', 'shot', 'fight'],
]
const CRAFTS = [
  ['Smithing', ['Ambren_Ingot', 'Ambren_Helm', 'Ambren_Pickaxe']],
  ['Carpentry', ['Lanai_Planks', 'Lanai_Tool_Rod', 'Lanai_Hunting_Bow']],
  ['Cooking', ['Fish_Pie', 'Herb_Bannock', 'Morel_Omelette']],
  ['Crafting', ['Cut_Garnet', 'Leather_Boots', 'Garnet_Keepers_Band']],
  ['Farming', ['Carrot', 'Barley_Seeds', 'Cabbage_Seeds']],
  ['Husbandry', ['Bucket_of_Milk', 'Egg', 'Cowhide']],
  ['Talar', ['Lit_Garnet', 'Lit_Quartz', 'Radiant_Quartz']],
  ['Wayfaring', ['Sea_Boots', 'Navigators_Bowl', 'Leather_Boots']],
]
const ALL_SKILLS = ['Woodcutting', 'Mining', 'Fishing', 'Foraging', 'Hunting', 'Carpentry', 'Smithing', 'Cooking', 'Crafting', 'Farming', 'Husbandry', 'Talar', 'Wayfaring', 'Melee', 'Defense', 'Constitution']
// Creatures fought (never the hunted, and not the Trow or Draugr: Nathan, 2026-11-27).
const BEASTS_A = ['Dock_Rat', 'Shore_Crab', 'Jackalope', 'Grey_Wolf', 'Kelpie', 'Hodag', 'Nuckelavee', 'Snallygaster']
const BEASTS_B = ['Wrecker', 'Sidehill_Gouger', 'Siren', 'Wolverine', 'Each-uisge', 'Reaver', 'Cave_Bear', 'Slide-rock_Bolter']
const NAMES = { 'Dock_Rat': 'Dock Rat', 'Shore_Crab': 'Shore Crab', 'Grey_Wolf': 'Grey Wolf', 'Sidehill_Gouger': 'Sidehill Gouger', 'Cave_Bear': 'Cave Bear', 'Slide-rock_Bolter': 'Slide-rock Bolter' }
// What comes through the tear: stand-ins until the invaders are drawn. Swap in
// their names (images/bestiary/<Name>.png) and the silhouettes follow.
const TEAR_SHAPES = ['Cave_Bear', 'Sea_Eagle', 'Siren', 'Wolverine', 'Reaver']
// Ports on the island maps (fractions of the 1080 map), and the way out of each harbor.
const ROUTE_TAIAR = [[.604, .571], [.639, .611], [.667, .662], [.741, .676], [.889, .653], [1.0, .64]]
const ROUTE_ANTURA = [[.0, .86], [.25, .92], [.55, .93], [.70, .86], [.67, .75], [.64, .68], [.60, .652]]

const images = {}
function load(key, src) {
  return new Promise(res => { const i = new Image(); i.onload = () => { images[key] = i; res() }; i.onerror = () => { console.warn('missing', src); res() }; i.src = src })
}
async function loadAll() {
  const jobs = []
  for (const u of ['stone', 'red', 'frame-gold', 'frame-stone', 'slot', 'parchment', 'bricks']) jobs.push(load('ui:' + u, IMG + 'ui/stonehold/' + u + '.webp'))
  for (const s of ALL_SKILLS) jobs.push(load('skill:' + s, IMG + 'skills/' + s + 'Skill.png'))
  const items = new Set(['Lanai_Hunting_Bow', 'Deerhide', 'Ambren_Arrow', 'Gold'])
  for (const [, its] of CRAFTS) its.forEach(i => items.add(i))
  for (const it of items) jobs.push(load('item:' + it, IMG + 'items/' + it + '.png'))
  for (const c of [...BEASTS_A, ...BEASTS_B, ...TEAR_SHAPES]) jobs.push(load('beast:' + c, IMG + 'bestiary/' + c + '.png'))
  for (const f of new Set(Object.values(SHOTS).map(s => s[0]))) jobs.push(load('shot:' + f, 'shots/' + f + '.jpg'))
  jobs.push(load('map:taiar', IMG + 'maps/Taiar_Island.jpg'))
  jobs.push(load('map:antura', IMG + 'maps/Antura.jpg'))
  jobs.push(load('map:taiarIslets', IMG + 'maps/Taiar_Islets.jpg'))
  jobs.push(load('map:anturaIslets', IMG + 'maps/Antura_Islets.jpg'))
  await Promise.all(jobs)
  for (const f of ['600 80px Garamond', '700 80px Garamond', 'italic 400 40px Garamond', '500 40px Garamond']) await document.fonts.load(f)
  makeSilhouettes(); makeSoftMaps()
}

// Black cut-outs for what comes through the tear.
const shadows = {}
function makeSilhouettes() {
  for (const k of TEAR_SHAPES) {
    const im = images['beast:' + k]; if (!im) continue
    const c = document.createElement('canvas'); c.width = im.width; c.height = im.height
    const x = c.getContext('2d'); x.drawImage(im, 0, 0)
    x.globalCompositeOperation = 'source-in'; x.fillStyle = '#060307'; x.fillRect(0, 0, c.width, c.height)
    shadows[k] = c
  }
}
// The maps with their square edges melted into the sea around them.
const soft = {}; let SEA = '#0b2440'
function makeSoftMaps() {
  for (const k of ['taiar', 'antura']) {
    const im = images['map:' + k]; if (!im) continue
    const c = document.createElement('canvas'); c.width = im.width; c.height = im.height
    const x = c.getContext('2d'); x.drawImage(im, 0, 0)
    if (k === 'taiar') { const d = x.getImageData(4, 4, 1, 1).data; SEA = `rgb(${d[0]},${d[1]},${d[2]})` }
    x.globalCompositeOperation = 'destination-in'
    const gr = x.createRadialGradient(c.width / 2, c.height / 2, c.width * .32, c.width / 2, c.height / 2, c.width * .5)
    gr.addColorStop(0, 'rgba(0,0,0,1)'); gr.addColorStop(1, 'rgba(0,0,0,0)')
    x.fillStyle = gr; x.fillRect(0, 0, c.width, c.height)
    soft[k] = c
  }
}

// ---- Helpers ------------------------------------------------------------------
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v))
const lerp = (a, b, u) => a + (b - a) * u
const easeOut = u => 1 - Math.pow(1 - clamp(u), 3)
const easeInOut = u => { u = clamp(u); return u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2 }
const backOut = u => { u = clamp(u); const c = 1.70158; return 1 + (c + 1) * Math.pow(u - 1, 3) + c * Math.pow(u - 1, 2) }
function rng(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296 } }
const win = (t, s, e, a = .25, b = .25) => clamp((t - s) / a) * clamp((e - t) / b)
// which slice of a run of equal parts t is in, and how far into it
const slice = (t, start, len, n) => { const i = clamp(Math.floor((t - start) / len), 0, n - 1); return [i, t - (start + i * len)] }

function tile(im, alpha = 1, scale = 1, ox = 0, oy = 0) {
  if (!im) return
  g.save(); g.globalAlpha = alpha
  const w = im.width * scale, h = im.height * scale
  for (let y = -h + ((oy % h) + h) % h; y < H; y += h) for (let x = -w + ((ox % w) + w) % w; x < W; x += w) g.drawImage(im, x, y, w, h)
  g.restore()
}
function cover(im, x, y, w, h, zoom = 1, fx = .5, fy = .5) {
  if (!im) return
  const s = Math.max(w / im.width, h / im.height) * zoom
  const iw = im.width * s, ih = im.height * s
  g.drawImage(im, x + (w - iw) * fx, y + (h - ih) * fy, iw, ih)
}
function nineSlice(im, x, y, w, h, s, b, fill = false) {
  if (!im) return
  const sw = im.width, sh = im.height
  const P = (sx, sy, sW, sH, dx, dy, dW, dH) => { if (sW > 0 && sH > 0 && dW > 0 && dH > 0) g.drawImage(im, sx, sy, sW, sH, dx, dy, dW, dH) }
  P(0, 0, s, s, x, y, b, b); P(sw - s, 0, s, s, x + w - b, y, b, b)
  P(0, sh - s, s, s, x, y + h - b, b, b); P(sw - s, sh - s, s, s, x + w - b, y + h - b, b, b)
  P(s, 0, sw - 2 * s, s, x + b, y, w - 2 * b, b); P(s, sh - s, sw - 2 * s, s, x + b, y + h - b, w - 2 * b, b)
  P(0, s, s, sh - 2 * s, x, y + b, b, h - 2 * b); P(sw - s, s, s, sh - 2 * s, x + w - b, y + b, b, h - 2 * b)
  if (fill) P(s, s, sw - 2 * s, sh - 2 * s, x + b, y + b, w - 2 * b, h - 2 * b)
}
function goldFrame(x, y, w, h, alpha = 1) { g.save(); g.globalAlpha = alpha; nineSlice(images['ui:frame-gold'], x, y, w, h, 34, 34); g.restore() }
function goldText(str, x, y, size, opts = {}) {
  const { weight = 600, align = 'center', alpha = 1, spacing = 0, italic = false, glow = .5, color } = opts
  if (alpha <= 0) return
  g.save(); g.globalAlpha = alpha
  g.font = `${italic ? 'italic ' : ''}${weight} ${size}px Garamond`
  g.textAlign = align; g.textBaseline = 'middle'
  if ('letterSpacing' in g) g.letterSpacing = spacing + 'px'
  if (color) g.fillStyle = color
  else { const gr = g.createLinearGradient(0, y - size * .55, 0, y + size * .5); gr.addColorStop(0, '#f5dc94'); gr.addColorStop(.45, '#e4c06a'); gr.addColorStop(.55, '#c9a14a'); gr.addColorStop(1, '#8a6a2c'); g.fillStyle = gr }
  g.shadowColor = 'rgba(0,0,0,.95)'; g.shadowBlur = size * .18; g.shadowOffsetY = size * .04
  g.fillText(str, x, y)
  if (glow > 0) { g.shadowColor = `rgba(228,192,106,${glow * .6})`; g.shadowBlur = size * .5; g.shadowOffsetY = 0; g.globalAlpha = alpha * glow * .5; g.fillText(str, x, y) }
  g.restore()
}
function plainText(str, x, y, size, opts = {}) { goldText(str, x, y, size, { glow: 0, color: '#cfc6b4', weight: 500, ...opts }) }
function vignette(strength = .85) {
  const gr = g.createRadialGradient(W / 2, H / 2, H * .3, W / 2, H / 2, H * .95)
  gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, `rgba(0,0,0,${strength})`)
  g.fillStyle = gr; g.fillRect(0, 0, W, H)
}
function stoneBackdrop(t, dark = .55) {
  g.fillStyle = '#0a0a0a'; g.fillRect(0, 0, W, H)
  tile(images['ui:stone'], 1, 1.6, -t * 6, t * 2)
  g.fillStyle = `rgba(0,0,0,${dark})`; g.fillRect(0, 0, W, H)
}
function embers(t, n = 70, color = [228, 150, 60], speed = 1, alpha = 1) {
  const r = rng(7)
  g.save(); g.globalCompositeOperation = 'lighter'
  for (let i = 0; i < n; i++) {
    const x0 = r() * W, sp = (40 + r() * 110) * speed, ph = r() * 50, sz = 1 + r() * 3.2, sway = 20 + r() * 50, f = .3 + r() * 1.2
    const y = H + 40 - (((t + ph) * sp) % (H + 120))
    const x = x0 + Math.sin((t + ph) * f) * sway
    const a = alpha * clamp(y / H) * (.4 + .6 * Math.abs(Math.sin((t + ph) * 2.3)))
    const gr = g.createRadialGradient(x, y, 0, x, y, sz * 4)
    gr.addColorStop(0, `rgba(${color[0]},${color[1]},${color[2]},${a})`); gr.addColorStop(1, 'rgba(0,0,0,0)')
    g.fillStyle = gr; g.fillRect(x - sz * 4, y - sz * 4, sz * 8, sz * 8)
  }
  g.restore()
}
function item(name, x, y, size, alpha = 1, rot = 0) {
  const im = images['item:' + name]; if (!im || alpha <= 0) return
  g.save(); g.globalAlpha = alpha; g.translate(x, y); g.rotate(rot)
  g.shadowColor = 'rgba(0,0,0,.8)'; g.shadowBlur = size * .15; g.shadowOffsetY = size * .05
  g.drawImage(im, -size / 2, -size / 2, size, size); g.restore()
}
function slotTile(x, y, s, alpha = 1) { const im = images['ui:slot']; if (!im) return; g.save(); g.globalAlpha = alpha; g.drawImage(im, x - s / 2, y - s / 2, s, s); g.restore() }
function skillIcon(name, x, y, s, alpha = 1) { const im = images['skill:' + name]; if (!im) return; g.save(); g.globalAlpha = alpha; g.drawImage(im, x - s / 2, y - s / 2, s, s); g.restore() }
function flash(a, color = '255,240,200') { if (a <= 0) return; g.fillStyle = `rgba(${color},${clamp(a)})`; g.fillRect(0, 0, W, H) }
function shake(t, since, amount) { const k = amount * Math.exp(-since * 9); g.translate(Math.sin(t * 97) * k, Math.cos(t * 83) * k) }

// A real game screen. 'full' fills the frame with the crop; 'panel' sets the crop
// in a gold frame over the whole screen, blurred and dimmed.
function shot(key, lt, opts = {}) {
  const [file, cx, cy, cw, ch] = SHOTS[key]
  const im = images['shot:' + file]; if (!im) return
  const { mode = 'full', zoom = .06, dir = 1, len = BAR } = opts
  const z = 1 + zoom * easeOut(lt / (len * 1.4))
  g.fillStyle = '#080808'; g.fillRect(0, 0, W, H)
  if (mode === 'full') {
    const s = Math.max(W / cw, H / ch) * z
    const iw = cw * s, ih = ch * s
    g.drawImage(im, cx, cy, cw, ch, (W - iw) / 2 + dir * zoom * 200 * easeOut(lt / len), (H - ih) / 2, iw, ih)
    vignette(.7)
  } else {
    g.save(); g.filter = 'blur(10px) brightness(.35)'; cover(im, -40, -40, W + 80, H + 80, 1.02 + zoom * easeOut(lt / len)); g.restore()
    const maxW = 1560, maxH = 860
    const s = Math.min(maxW / cw, maxH / ch) * (1 + zoom * .5 * easeOut(lt / len))
    const iw = cw * s, ih = ch * s, x = (W - iw) / 2, y = (H - ih) / 2 + 20
    g.save(); g.shadowColor = 'rgba(0,0,0,.9)'; g.shadowBlur = 60; g.fillStyle = '#000'; g.fillRect(x, y, iw, ih); g.restore()
    g.drawImage(im, cx, cy, cw, ch, x, y, iw, ih)
    goldFrame(x - 16, y - 16, iw + 32, ih + 32)
    vignette(.55)
  }
}
// A caption plate, lower left: skill icon in a slot, a name, and a line.
function plate(name, line, lt, icon) {
  const a = clamp(lt / .12), slide = 60 * (1 - easeOut(lt / .25))
  g.save(); g.globalAlpha = a; g.translate(-slide, 0)
  const gr = g.createLinearGradient(0, 0, 900, 0); gr.addColorStop(0, 'rgba(0,0,0,.85)'); gr.addColorStop(1, 'rgba(0,0,0,0)')
  g.fillStyle = gr; g.fillRect(0, H - 230, 900, 170)
  if (icon) { slotTile(150, H - 145, 120); skillIcon(icon, 150, H - 145, 92) }
  g.restore()
  goldText(name, (icon ? 240 : 90) - slide, H - (line ? 165 : 145), 74, { align: 'left', weight: 700, spacing: 2, alpha: a })
  if (line) plainText(line, (icon ? 242 : 92) - slide, H - 105, 34, { align: 'left', italic: true, weight: 400, alpha: a })
}
// A crafted-thing card: skill icon, then its goods popping in on the beat.
function craftCard(name, items, lt, t) {
  stoneBackdrop(t, .62)
  const lg = g.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, 800)
  lg.addColorStop(0, 'rgba(201,140,60,.22)'); lg.addColorStop(1, 'rgba(0,0,0,0)')
  g.fillStyle = lg; g.fillRect(0, 0, W, H)
  embers(t, 40, [228, 150, 60], 1.5, .6)
  const p = backOut(lt / .2)
  slotTile(W / 2, H / 2 - 80, 250 * p); skillIcon(name, W / 2, H / 2 - 80, 190 * p)
  items.forEach((it, k) => {
    const q = backOut((lt - .05 - k * .05) / .2)
    const x = W / 2 + (k - 1) * 330 * (k === 1 ? 0 : 1) + (k === 1 ? 0 : 0)
    const xx = k === 0 ? W / 2 - 330 : k === 1 ? W / 2 + 330 : W / 2
    const yy = k === 2 ? H / 2 + 230 : H / 2 - 60
    if (k < 2) item(it, xx, yy, 170 * clamp(q, 0, 1.3), clamp(q * 3))
  })
  goldText(name, W / 2, H / 2 + 120, 96, { weight: 700, spacing: 4, alpha: clamp(lt / .08) })
  vignette(.85)
  flash(.12 * Math.exp(-lt * 12), '228,192,106')
}
function creature(k, lt, side) {
  const im = images['beast:' + k]
  g.save(); shake(lt * 50, lt, 16)
  g.fillStyle = '#070405'; g.fillRect(-40, -40, W + 80, H + 80)
  g.save(); g.globalAlpha = .5; cover(images['ui:red'], 0, 0, W, H, 1.1); g.restore()
  g.fillStyle = 'rgba(0,0,0,.35)'; g.fillRect(0, 0, W, H)
  const p = backOut(lt / .16)
  if (im) { g.save(); g.translate(W / 2 + side * 220, H / 2 + 40); g.scale(p * 3.1, p * 3.1); g.shadowColor = 'rgba(255,80,40,.5)'; g.shadowBlur = 40; g.drawImage(im, -128, -128, 256, 256); g.restore() }
  goldText(NAMES[k] || k.replace(/_/g, ' '), W / 2 - side * 470, H / 2 + 20, 96, { weight: 700, spacing: 3, alpha: clamp(lt / .05) })
  g.restore()
  vignette(.85)
  flash(.3 * Math.exp(-lt * 14), '255,140,100')
}

// ---- Scenes ---------------------------------------------------------------------
// Bars: 0-1 title, 2-3 the game, 4-9 skill flashes, 10-12 sixteen skills,
// 13-18 the world, 19-22 setting out, 23-26 Invasions (the next update), 27+
// the end card with the launch date.

function sceneTitle(t) {
  stoneBackdrop(t, .7)
  const lg = g.createRadialGradient(W / 2, H / 2 + 20, 0, W / 2, H / 2, 800)
  lg.addColorStop(0, `rgba(201,140,60,${.3 + .12 * beatPulse(t)})`); lg.addColorStop(1, 'rgba(0,0,0,0)')
  g.fillStyle = lg; g.fillRect(0, 0, W, H)
  embers(t, 90)
  const sc = lerp(1.3, 1, easeOut(t / 1.2))
  g.save(); g.translate(W / 2, H / 2 - 20); g.scale(sc, sc)
  goldText('Talaran', 0, 0, 240, { weight: 700, spacing: 18, alpha: clamp(t / .25), glow: .6 + .4 * barPulse(t) })
  g.restore()
  const lw = 520 * easeOut((t - bar(1)) / .5)
  const gr = g.createLinearGradient(W / 2 - lw, 0, W / 2 + lw, 0)
  gr.addColorStop(0, 'rgba(201,161,74,0)'); gr.addColorStop(.5, 'rgba(228,192,106,1)'); gr.addColorStop(1, 'rgba(201,161,74,0)')
  g.fillStyle = gr; g.fillRect(W / 2 - lw, H / 2 + 110, lw * 2, 2)
  vignette(.9)
  flash(.6 * Math.exp(-t * 4))
}

function sceneGame(t) {
  const s = bar(2), lt = t - s
  // the whole game, pulling back to show all of it
  const im = images['shot:main']
  g.fillStyle = '#000'; g.fillRect(0, 0, W, H)
  const z = lerp(1.35, 1.0, easeOut(lt / (BAR * 1.6)))
  g.save(); g.translate(W / 2, H / 2); g.scale(z, z); g.drawImage(im, -W / 2, -H / 2, W, H); g.restore()
  g.fillStyle = 'rgba(0,0,0,.25)'; g.fillRect(0, 0, W, H)
  const band = g.createLinearGradient(0, H - 260, 0, H); band.addColorStop(0, 'rgba(0,0,0,0)'); band.addColorStop(1, 'rgba(0,0,0,.9)')
  g.fillStyle = band; g.fillRect(0, H - 260, W, 260)
  goldText('A medieval skilling world, in your browser', W / 2, H - 110, 64, { weight: 700, spacing: 2, alpha: win(t, s + .2, bar(4), .3, .15) })
  flash(.4 * Math.exp(-lt * 6))
}

function sceneSkillFlashes(t) {
  const s = bar(4), half = BAR / 2
  if (t < bar(7)) {
    const [i, lt] = slice(t, s, half, SKILL_FLASH.length)
    const [name, kind, what] = SKILL_FLASH[i]
    if (kind === 'shot') shot(what, lt, { len: half, dir: 0, zoom: .05 })
    else craftCard(name, what, lt, t)
    plate(name, null, lt, name)
    flash(.15 * Math.exp(-lt * 14))
  } else if (t < bar(8)) {
    // a bar of monsters, two to a beat
    const [i, lt] = slice(t, bar(7), BEAT / 2, 8)
    creature(BEASTS_A[i], lt, i % 2 ? 1 : -1)
  } else {
    const [i, lt] = slice(t, bar(8), BEAT, CRAFTS.length)
    craftCard(CRAFTS[i][0], CRAFTS[i][1], lt, t)
  }
}

function sceneSixteen(t) {
  const s = bar(10), u = (t - s) / (bar(13) - s)
  stoneBackdrop(t, .7)
  embers(t, 60)
  const R = lerp(1000, 560, easeOut(u * 1.8))
  ALL_SKILLS.forEach((name, k) => {
    const ang = k / ALL_SKILLS.length * Math.PI * 2 + t * .35
    const x = W / 2 + Math.cos(ang) * R * 1.25, y = H / 2 + Math.sin(ang) * R * .62
    slotTile(x, y, 118, .95); skillIcon(name, x, y, 86)
  })
  goldText('Sixteen skills', W / 2, H / 2 - 50, 140, { weight: 700, spacing: 6, alpha: easeOut((t - s) / .3) })
  plainText('Train any of them, all of them, from level one to a hundred.', W / 2, H / 2 + 55, 42, { italic: true, weight: 400, alpha: easeOut((t - bar(11)) / .4) })
  vignette(.9)
  flash(.35 * Math.exp(-(t - s) * 5))
}

const WORLD = [
  ['together', 'panel', 'Play alongside everyone else', 'One world, one chat, a town square full of people'],
  ['quank', 'panel', 'Meet the island\'s folk', 'Quests are found, never listed'],
  ['shops', 'panel', 'Raise a shop', 'Sell to other players while you are away'],
  ['museum', 'panel', 'Fill the museum', 'Every find has a case waiting for it'],
  ['sloth', 'panel', 'Stand a round at the Salty Sloth', 'And read the day\'s Chronicle'],
  ['highscores', 'panel', 'Climb the highscores', 'Every skill, all time and this week'],
]
function sceneWorld(t) {
  const [i, lt] = slice(t, bar(13), BAR, WORLD.length)
  const [key, mode, title, line] = WORLD[i]
  shot(key, lt, { mode, dir: i % 2 ? -1 : 1 })
  plate(title, line, lt)
  flash(.18 * Math.exp(-lt * 10))
}

function catmull(pts, u) {
  const n = pts.length - 1, f = clamp(u) * n, i = Math.min(Math.floor(f), n - 1), q = f - i
  const p0 = pts[Math.max(i - 1, 0)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(i + 2, n)]
  const c = (a, b, c2, d) => .5 * ((2 * b) + (-a + c2) * q + (2 * a - 5 * b + 4 * c2 - d) * q * q + (-a + 3 * b - 3 * c2 + d) * q * q * q)
  return [c(p0[0], p1[0], p2[0], p3[0]), c(p0[1], p1[1], p2[1], p3[1])]
}
// The island map in the game's own window lifts out of it onto the open sea,
// then the camera finds Talador and follows the crossing into Wendhaven.
const LIFT = .45
function sceneSail(t) {
  const t0 = bar(20)
  if (t < t0 - LIFT) {
    const lt = t - bar(19)
    shot('islandmap', lt, { mode: 'panel', zoom: .05 })
    plate('Then set out', null, lt)
    return
  }
  const mw = 1080, gap = 260, ax = mw + gap
  const route = [...ROUTE_TAIAR.map(([x, y]) => [x * mw, y * mw]), ...ROUTE_ANTURA.map(([x, y]) => [ax + x * mw, y * mw])]
  // panel ends at 0.896 * (1 + .025) of 960 crop pixels on screen
  const z0 = 0.896 * 1.025 * 960 / mw, zSail = .95
  const find = easeInOut((t - (t0 + .5)) / .9)          // from the map's middle to Talador
  const travel = easeInOut(clamp((t - (t0 + 1.2)) / (bar(23) - t0 - 1.5)))
  const [bx, by] = catmull(route, travel)
  const camx = lerp(mw / 2, bx, find), camy = lerp(mw / 2, by, find), z = lerp(z0, zSail, find)
  g.fillStyle = SEA; g.fillRect(0, 0, W, H)
  g.save(); g.translate(W / 2 - camx * z, H / 2 + 20 - camy * z); g.scale(z, z)
  if (soft.taiar) g.drawImage(soft.taiar, 0, 0, mw, mw)
  if (soft.antura) g.drawImage(soft.antura, ax, 0, mw, mw)
  if (travel > 0) {
    g.strokeStyle = 'rgba(245,220,148,.95)'; g.lineWidth = 7 / z * .9; g.setLineDash([2, 20]); g.lineCap = 'round'
    g.beginPath()
    for (let k = 0; k <= 240; k++) { const [x, y] = catmull(route, k / 240 * travel); k ? g.lineTo(x, y) : g.moveTo(x, y) }
    g.stroke(); g.setLineDash([])
  }
  const shipA = clamp((t - (t0 + .9)) / .3)
  if (shipA > 0) {
    const gr = g.createRadialGradient(bx, by, 0, bx, by, 42); gr.addColorStop(0, `rgba(255,230,160,${shipA})`); gr.addColorStop(1, 'rgba(255,200,100,0)')
    g.fillStyle = gr; g.fillRect(bx - 42, by - 42, 84, 84)
  }
  for (const [px, py] of [[ROUTE_TAIAR[0][0] * mw, ROUTE_TAIAR[0][1] * mw], [ax + ROUTE_ANTURA.at(-1)[0] * mw, ROUTE_ANTURA.at(-1)[1] * mw]]) {
    g.beginPath(); g.arc(px, py, 12, 0, Math.PI * 2); g.fillStyle = `rgba(245,220,148,${shipA})`; g.fill()
  }
  g.restore()
  vignette(.95 * clamp((t - t0) / .6))
  // the lift: the game window around the map dissolves in a sweep of gold
  const lift = clamp((t - (t0 - LIFT)) / (LIFT * 2))
  if (lift < 1) {
    g.save(); g.globalAlpha = 1 - easeInOut(lift)
    shot('islandmap', BAR - LIFT + (t - (t0 - LIFT)), { mode: 'panel', zoom: .05 })
    g.restore()
    const sx = lerp(-400, W + 400, easeInOut(lift))
    const sweep = g.createLinearGradient(sx - 300, 0, sx + 300, 0)
    sweep.addColorStop(0, 'rgba(245,220,148,0)'); sweep.addColorStop(.5, `rgba(245,220,148,${.55 * (1 - lift)})`); sweep.addColorStop(1, 'rgba(245,220,148,0)')
    g.save(); g.globalCompositeOperation = 'lighter'; g.fillStyle = sweep; g.fillRect(0, 0, W, H); g.restore()
  }
  flash(.35 * Math.exp(-Math.max(0, t - t0) * 6) * (t >= t0 ? 1 : 0))
  const u = travel
  goldText('From Talador', W / 2, 140, 84, { weight: 700, spacing: 4, alpha: win(t, t0 + .9, t0 + .9 + (bar(23) - t0) * .45, .3, .2) })
  goldText('To Wendhaven, on Antura', W / 2, 140, 84, { weight: 700, spacing: 4, alpha: u > .5 ? win(u, .55, 1.05, .08, .05) : 0 })
}

// The tear: a glowing slit across a dark sky.
const TEAR = (() => { const r = rng(42); const pts = []; let y = 0, v = 0; for (let k = 0; k <= 48; k++) { v = v * .6 + (r() - .5) * .018; y = y * .92 + v; pts.push([k / 48, y + Math.sin(k / 48 * Math.PI * 1.2) * .035]) } return pts })()
function drawTear(cx, cy, len, open, t) {
  if (open <= 0) return
  g.save(); g.translate(cx, cy); g.rotate(-.12)
  const L = len * clamp(open * 1.6), wid = 10 + 95 * easeOut(open)
  const path = ws => {
    g.beginPath()
    TEAR.forEach(([x, y], k) => { const px = (x - .5) * L, py = y * len, w = Math.pow(Math.sin(x * Math.PI), 1.6) * wid * ws * (1 + .1 * Math.sin(t * 5 + k * .7)); k ? g.lineTo(px, py - w) : g.moveTo(px, py - w) })
    for (let k = TEAR.length - 1; k >= 0; k--) { const [x, y] = TEAR[k]; const px = (x - .5) * L, py = y * len, w = Math.pow(Math.sin(x * Math.PI), 1.6) * wid * ws * (1 + .1 * Math.cos(t * 4 + k * .9)); g.lineTo(px, py + w) }
    g.closePath()
  }
  g.globalCompositeOperation = 'lighter'
  g.shadowColor = 'rgba(170,60,255,1)'; g.shadowBlur = 120; path(2.2); g.fillStyle = 'rgba(90,20,160,.30)'; g.fill()
  g.shadowColor = 'rgba(255,70,40,1)'; g.shadowBlur = 50; path(1.15); g.fillStyle = 'rgba(230,90,60,.5)'; g.fill()
  path(.95); g.fillStyle = 'rgba(255,220,200,.55)'; g.fill()
  g.globalCompositeOperation = 'source-over'; g.shadowBlur = 0
  path(.7); const gr = g.createLinearGradient(0, -wid, 0, wid); gr.addColorStop(0, '#12001c'); gr.addColorStop(.5, '#000'); gr.addColorStop(1, '#1c0006'); g.fillStyle = gr; g.fill()
  g.restore()
}
// Invasions, on the music's drop (the last update before 1.0).
function sceneTear(t) {
  const s0 = bar(23), lt = t - s0
  g.save(); shake(t, lt, 16)
  g.fillStyle = '#060306'; g.fillRect(-40, -40, W + 80, H + 80)
  g.save(); g.globalAlpha = .45; cover(images['ui:red'], 0, 0, W, H, 1.1); g.restore()
  g.fillStyle = 'rgba(0,0,0,.5)'; g.fillRect(0, 0, W, H)
  drawTear(W / 2, H / 2 - 170, 1700, lt / (BAR * .7), t)
  const fg = g.createRadialGradient(W / 2, H / 2 + 120, 50, W / 2, H / 2 + 120, 900)
  fg.addColorStop(0, `rgba(150,60,200,${.5 * clamp(lt / BAR)})`); fg.addColorStop(1, 'rgba(0,0,0,0)')
  g.save(); g.globalCompositeOperation = 'lighter'; g.fillStyle = fg; g.fillRect(0, 0, W, H); g.restore()
  TEAR_SHAPES.slice(0, 3).forEach((k, j) => {
    const c = shadows[k]; if (!c) return
    const q = clamp((t - bar(24) - j * BEAT) / (BEAT * 2.5)); if (q <= 0) return
    const x = W / 2 + (j - 1) * 520, y = lerp(H / 2 - 150, H / 2 + 310, easeOut(q)), sc = lerp(.4, 1.2, easeOut(q))
    g.save(); g.globalAlpha = clamp(q * 3); g.translate(x, y); g.scale(sc, sc)
    g.shadowColor = 'rgba(200,80,255,.9)'; g.shadowBlur = 40; g.drawImage(c, -128, -128, 256, 256); g.restore()
  })
  embers(t, 80, [200, 80, 255], 2, .9)
  g.restore()
  vignette(.9)
  goldText('The sky over Talaran is tearing.', W / 2, 130, 70, { weight: 700, spacing: 3, alpha: win(t, s0 + .25, bar(25), .3, .15), color: '#f2e2c8' })
  // the name, then what it is
  const nameIn = t - bar(25)
  if (nameIn > 0) {
    const band = g.createLinearGradient(0, H / 2 - 250, 0, H / 2 + 250); band.addColorStop(0, 'rgba(0,0,0,0)'); band.addColorStop(.5, 'rgba(0,0,0,.6)'); band.addColorStop(1, 'rgba(0,0,0,0)')
    g.fillStyle = band; g.fillRect(0, H / 2 - 250, W, 500)
    const sc = lerp(1.3, 1, easeOut(nameIn / .3))
    g.save(); g.translate(W / 2, H / 2 - 30); g.scale(sc, sc)
    goldText('Invasions', 0, 0, 190, { weight: 700, spacing: 14, alpha: clamp(nameIn / .08), glow: 1 })
    g.restore()
  }
  flash(.85 * Math.exp(-lt * 5), '235,210,255')
  if (nameIn > 0) flash(.5 * Math.exp(-nameIn * 7), '235,210,255')
}

function sceneEnd(t) {
  const s = bar(27)
  stoneBackdrop(t, .72)
  const lg = g.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, 900)
  lg.addColorStop(0, `rgba(201,140,60,${.3 + .15 * barPulse(t)})`); lg.addColorStop(1, 'rgba(0,0,0,0)')
  g.fillStyle = lg; g.fillRect(0, 0, W, H)
  embers(t, 110)
  const fw = 1300, fh = 640, fa = easeOut((t - s) / .5)
  g.save(); g.globalAlpha = fa * .8; g.fillStyle = 'rgba(8,8,8,.7)'; g.fillRect(W / 2 - fw / 2 + 20, H / 2 - fh / 2 + 20, fw - 40, fh - 40); g.restore()
  goldFrame(W / 2 - fw / 2, H / 2 - fh / 2, fw, fh, fa)
  const sc = lerp(1.15, 1, easeOut((t - s) / 1.2))
  g.save(); g.translate(W / 2, H / 2 - 110); g.scale(sc, sc)
  goldText('Talaran', 0, 0, 200, { weight: 700, spacing: 16, alpha: fa, glow: .6 + .4 * barPulse(t) })
  g.restore()
  goldText('Version 1.0 launches December 11th, 2026', W / 2, H / 2 + 30, 60, { weight: 600, spacing: 4, alpha: easeOut((t - bar(28)) / .4) })
  plainText('Free to play in your browser. No download.', W / 2, H / 2 + 115, 42, { italic: true, weight: 400, alpha: easeOut((t - bar(29)) / .4) })
  goldText('talaran.net', W / 2, H / 2 + 215, 60, { weight: 700, spacing: 4, alpha: easeOut((t - bar(30)) / .4), glow: 1 })
  vignette(.9)
  flash(.6 * Math.exp(-(t - s) * 3))
  plainText('Music: "Celtic Impulse" by Kevin MacLeod (incompetech.com), CC BY 4.0', W / 2, H - 50, 22, { alpha: .55 * easeOut((t - bar(31)) / 1), weight: 500 })
  const out = clamp((t - (DURATION - 2.2)) / 2)
  if (out > 0) { g.fillStyle = `rgba(0,0,0,${out})`; g.fillRect(0, 0, W, H) }
}

const SCENES = [
  [0, bar(2), sceneTitle],
  [bar(2), bar(4), sceneGame],
  [bar(4), bar(10), sceneSkillFlashes],
  [bar(10), bar(13), sceneSixteen],
  [bar(13), bar(19), sceneWorld],
  [bar(19), bar(23), sceneSail],
  [bar(23), bar(27), sceneTear],
  [bar(27), 999, sceneEnd],
]

function render(t) {
  g.save()
  g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; g.globalCompositeOperation = 'source-over'; g.shadowBlur = 0; g.filter = 'none'
  const sc = SCENES.find(([s, e]) => t >= s && t < e) || SCENES[SCENES.length - 1]
  sc[2](t)
  g.restore()
}
window.render = render
window.DURATION = DURATION

window.ready = loadAll().then(() => {
  render(0)
  if (new URLSearchParams(location.search).has('render')) return
  const music = document.getElementById('music'), btn = document.getElementById('play')
  const tParam = Number(new URLSearchParams(location.search).get('t') || 0)
  btn.hidden = false
  btn.onclick = () => { btn.hidden = true; music.currentTime = tParam; music.play(); const loop = () => { render(music.currentTime); if (!music.paused) requestAnimationFrame(loop) }; loop() }
})
</script>
