<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Talaran Trailer</title>
<style>
  @font-face { font-family: 'Garamond'; src: url('../apps/client/public/fonts/EBGaramond-Medium.ttf'); font-weight: 500; }
  @font-face { font-family: 'Garamond'; src: url('../apps/client/public/fonts/EBGaramond-SemiBold.ttf'); font-weight: 600; }
  @font-face { font-family: 'Garamond'; src: url('../apps/client/public/fonts/EBGaramond-Bold.ttf'); font-weight: 700; }
  @font-face { font-family: 'Garamond'; src: url('../apps/client/public/fonts/EBGaramond-Italic.ttf'); font-style: italic; font-weight: 400; }
  html, body { margin: 0; background: #000; }
  canvas { display: block; width: 100vw; height: 56.25vw; max-height: 100vh; max-width: 177.78vh; margin: auto; }
  #play { position: fixed; inset: 0; display: grid; place-items: center; color: #c9a14a; font: 600 32px Garamond, serif; cursor: pointer; background: rgba(0,0,0,.6); }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<div id="play" hidden>Click to play</div>
<audio id="music" src="music-cut.mp3" preload="auto"></audio>
<script>
// Talaran launch trailer, first cut (2026-11-27).
// Everything is drawn by render(t), a pure function of the time in seconds, so
// the same page plays live (open it in a browser) and renders frame by frame
// (render.js). Music: "Celtic Impulse", Kevin MacLeod (incompetech.com), CC BY 4.0,
// cut to 76 s on its own bar lines (music-cut.mp3, see README.md).

const W = 1920, H = 1080
const cv = document.getElementById('c')
const g = cv.getContext('2d')

// ---- Beat grid: 144 BPM, first downbeat at 0.03 s ----------------------------
const BEAT = 0.41650, PHASE = 0.03, BAR = BEAT * 4
const bar = n => PHASE + n * BAR
const beatPulse = t => { const k = Math.floor((t - PHASE) / BEAT); const since = t - (PHASE + k * BEAT); return Math.exp(-since * 7) }
const barPulse = t => { const k = Math.floor((t - PHASE) / BAR); const since = t - (PHASE + k * BAR); return Math.exp(-since * 5) }

// ---- Assets -------------------------------------------------------------------
const IMG = '../apps/client/public/images/'
const SKILLS = [
  ['Woodcutting', 'Fell the Lanai', ['Ambren_Hatchet', 'Fine_Lanai_Log']],
  ['Mining', 'Break the granite', ['Ambren_Pickaxe', 'Ambren_Ore']],
  ['Fishing', 'Read the water', ['Ambren_Fishing_Rod', 'Garfish']],
  ['Foraging', 'Know the hedgerow', ['Chanterelle_Mushroom', 'Blackberries']],
  ['Hunting', 'Follow the tracks', ['Lanai_Hunting_Bow', 'Deerhide']],
  ['Carpentry', 'Square the plank', ['Lanai_Planks', 'Lanai_Tool_Rod']],
  ['Smithing', 'Work the forge', ['Ambren_Ingot', 'Ambren_Boots']],
  ['Cooking', 'Feed the island', ['Fish_Pie', 'Herb_Bannock']],
  ['Crafting', 'Cut and stitch', ['Cut_Garnet', 'Leather_Boots']],
  ['Farming', 'Turn the soil', ['Cabbage', 'Carrot']],
  ['Husbandry', 'Mind the herd', ['Bucket_of_Milk', 'Egg']],
  ['Talar', 'Fill the stone with light', ['Lit_Garnet', 'Lit_Quartz']],
  ['Wayfaring', 'Walk every road', ['Sea_Boots', 'Navigators_Bowl']],
  ['Melee', 'Strike', ['Ambren_Greatsword']],
  ['Defense', 'Stand', ['Ambren_Kite_Shield']],
  ['Constitution', 'Endure', ['Beef_and_Root_Stew']],
]
const WORLD = [
  ['Build a homestead.', ['Cabbage', 'Carrot', 'Barley_Seeds', 'Egg', 'Bucket_of_Milk', 'Cowhide']],
  ['Keep a shop.', ['Gold', 'Lanai_Planks', 'Ambren_Ingot', 'Fish_Pie', 'Leather', 'Cut_Quartz']],
  ['Fill the museum.', ['Agropelter_Knuckle', 'Kelpies_Bridle', 'Flawless_Garnet', 'Radiant_Quartz', 'Crabshell_Helm', 'Heartstone_Ring']],
  ['Earn a line in the Chronicle.', ['Magpies_Ring', 'Garnet_Wayfinders_Amulet', 'Knuckle_Ring', 'Matthews_Pie', 'Elderberry_Cordial', 'Even_More_Strongly_Worded_Reply']],
]
const CREATURES = ['Dock_Rat', 'Grey_Wolf', 'Boar', 'Hodag', 'Kelpie', 'Wolverine', 'Trow', 'Draugr', 'Snallygaster', 'Each-uisge', 'Nuckelavee', 'Slide-rock_Bolter']
const CREATURE_NAMES = { 'Dock_Rat': 'Dock Rat', 'Grey_Wolf': 'Grey Wolf', 'Slide-rock_Bolter': 'Slide-rock Bolter' }
const SILHOUETTES = ['Cave_Bear', 'Reaver', 'Siren', 'Ground_Sloth', 'Sea_Eagle', 'Wrecker']

const images = {}
function load(key, src) {
  return new Promise(res => { const i = new Image(); i.onload = () => { images[key] = i; res() }; i.onerror = () => { console.warn('missing', src); res() }; i.src = src })
}
async function loadAll() {
  const jobs = []
  const ui = ['stone', 'red', 'frame-gold', 'frame-stone', 'slot', 'parchment', 'button', 'bricks', 'orb-red', 'orb-purple']
  for (const u of ui) jobs.push(load('ui:' + u, IMG + 'ui/stonehold/' + u + '.webp'))
  for (const [name, , items] of SKILLS) {
    jobs.push(load('skill:' + name, IMG + 'skills/' + name + 'Skill.png'))
    for (const it of items) jobs.push(load('item:' + it, IMG + 'items/' + it + '.png'))
  }
  for (const [, items] of WORLD) for (const it of items) jobs.push(load('item:' + it, IMG + 'items/' + it + '.png'))
  for (const c of [...CREATURES, ...SILHOUETTES]) jobs.push(load('beast:' + c, IMG + 'bestiary/' + c + '.png'))
  jobs.push(load('map:taiar', IMG + 'maps/Taiar_Island.jpg'))
  jobs.push(load('map:antura', IMG + 'maps/Antura.jpg'))
  await Promise.all(jobs)
  await document.fonts.load('600 80px Garamond'); await document.fonts.load('700 80px Garamond'); await document.fonts.load('italic 400 40px Garamond'); await document.fonts.load('500 40px Garamond')
  makeSilhouettes(); makeSoftMaps()
}

// The maps with their square edges melted into the sea around them.
const soft = {}; let SEA = '#0b2440'
function makeSoftMaps() {
  for (const k of ['taiar', 'antura']) {
    const im = images['map:' + k]; if (!im) continue
    const c = document.createElement('canvas'); c.width = im.width; c.height = im.height
    const x = c.getContext('2d'); x.drawImage(im, 0, 0)
    if (k === 'taiar') { const d = x.getImageData(4, 4, 1, 1).data; SEA = `rgb(${d[0]},${d[1]},${d[2]})` }
    x.globalCompositeOperation = 'destination-in'
    const gr = x.createRadialGradient(c.width / 2, c.height / 2, c.width * .3, c.width / 2, c.height / 2, c.width * .5)
    gr.addColorStop(0, 'rgba(0,0,0,1)'); gr.addColorStop(1, 'rgba(0,0,0,0)')
    x.fillStyle = gr; x.fillRect(0, 0, c.width, c.height)
    soft[k] = c
  }
}

// Black cut-outs of creatures, for what comes through the tear (no art yet).
const shadows = {}
function makeSilhouettes() {
  for (const k of SILHOUETTES) {
    const im = images['beast:' + k]; if (!im) continue
    const c = document.createElement('canvas'); c.width = im.width; c.height = im.height
    const x = c.getContext('2d'); x.drawImage(im, 0, 0)
    x.globalCompositeOperation = 'source-in'; x.fillStyle = '#050304'; x.fillRect(0, 0, c.width, c.height)
    shadows[k] = c
  }
}

// ---- Helpers ------------------------------------------------------------------
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v))
const lerp = (a, b, u) => a + (b - a) * u
const easeOut = u => 1 - Math.pow(1 - clamp(u), 3)
const easeIn = u => Math.pow(clamp(u), 3)
const easeInOut = u => { u = clamp(u); return u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2 }
const backOut = u => { u = clamp(u); const c = 1.70158; return 1 + (c + 1) * Math.pow(u - 1, 3) + c * Math.pow(u - 1, 2) }
function rng(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296 } }
// fade in over a, hold, fade out over b, inside [s, e]
const window_ = (t, s, e, a = .25, b = .25) => clamp((t - s) / a) * clamp((e - t) / b)

function tile(im, alpha = 1, scale = 1, ox = 0, oy = 0) {
  if (!im) return
  g.save(); g.globalAlpha = alpha
  const w = im.width * scale, h = im.height * scale
  for (let y = -h + ((oy % h) + h) % h; y < H; y += h) for (let x = -w + ((ox % w) + w) % w; x < W; x += w) g.drawImage(im, x, y, w, h)
  g.restore()
}
function cover(im, x, y, w, h, zoom = 1, fx = .5, fy = .5) {
  if (!im) return
  const s = Math.max(w / im.width, h / im.height) * zoom
  const iw = im.width * s, ih = im.height * s
  g.drawImage(im, x + (w - iw) * fx, y + (h - ih) * fy, iw, ih)
}
// CSS border-image, the stonehold way: slice px from the source, drawn at width b.
function nineSlice(im, x, y, w, h, slice, b, fill = false) {
  if (!im) return
  const sw = im.width, sh = im.height, s = slice
  const P = (sx, sy, sW, sH, dx, dy, dW, dH) => { if (sW > 0 && sH > 0 && dW > 0 && dH > 0) g.drawImage(im, sx, sy, sW, sH, dx, dy, dW, dH) }
  P(0, 0, s, s, x, y, b, b); P(sw - s, 0, s, s, x + w - b, y, b, b)
  P(0, sh - s, s, s, x, y + h - b, b, b); P(sw - s, sh - s, s, s, x + w - b, y + h - b, b, b)
  P(s, 0, sw - 2 * s, s, x + b, y, w - 2 * b, b); P(s, sh - s, sw - 2 * s, s, x + b, y + h - b, w - 2 * b, b)
  P(0, s, s, sh - 2 * s, x, y + b, b, h - 2 * b); P(sw - s, s, s, sh - 2 * s, x + w - b, y + b, b, h - 2 * b)
  if (fill) P(s, s, sw - 2 * s, sh - 2 * s, x + b, y + b, w - 2 * b, h - 2 * b)
}
function goldFrame(x, y, w, h, alpha = 1) { g.save(); g.globalAlpha = alpha; nineSlice(images['ui:frame-gold'], x, y, w, h, 34, 34); g.restore() }

function goldText(str, x, y, size, opts = {}) {
  const { weight = 600, align = 'center', alpha = 1, spacing = 0, italic = false, glow = .5, color } = opts
  g.save()
  g.globalAlpha = alpha
  g.font = `${italic ? 'italic ' : ''}${weight} ${size}px Garamond`
  g.textAlign = align; g.textBaseline = 'middle'
  if ('letterSpacing' in g) g.letterSpacing = spacing + 'px'
  if (color) { g.fillStyle = color } else {
    const gr = g.createLinearGradient(0, y - size * .55, 0, y + size * .5)
    gr.addColorStop(0, '#f5dc94'); gr.addColorStop(.45, '#e4c06a'); gr.addColorStop(.55, '#c9a14a'); gr.addColorStop(1, '#8a6a2c')
    g.fillStyle = gr
  }
  g.shadowColor = `rgba(0,0,0,.9)`; g.shadowBlur = size * .15; g.shadowOffsetY = size * .04
  g.fillText(str, x, y)
  if (glow > 0) { g.shadowColor = `rgba(228,192,106,${glow * .6})`; g.shadowBlur = size * .5; g.shadowOffsetY = 0; g.globalAlpha = alpha * glow * .5; g.fillText(str, x, y) }
  g.restore()
}
function plainText(str, x, y, size, opts = {}) { goldText(str, x, y, size, { glow: 0, color: '#cfc6b4', weight: 500, ...opts }) }

function vignette(strength = .85) {
  const gr = g.createRadialGradient(W / 2, H / 2, H * .25, W / 2, H / 2, H * .95)
  gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, `rgba(0,0,0,${strength})`)
  g.fillStyle = gr; g.fillRect(0, 0, W, H)
}
function stoneBackdrop(t, dark = .55) {
  g.fillStyle = '#0a0a0a'; g.fillRect(0, 0, W, H)
  tile(images['ui:stone'], 1, 1.6, -t * 6, t * 2)
  g.fillStyle = `rgba(0,0,0,${dark})`; g.fillRect(0, 0, W, H)
}
// Embers rising, deterministic in t.
function embers(t, n = 70, color = [228, 150, 60], speed = 1, alpha = 1) {
  const r = rng(7)
  g.save(); g.globalCompositeOperation = 'lighter'
  for (let i = 0; i < n; i++) {
    const x0 = r() * W, sp = (40 + r() * 110) * speed, ph = r() * 50, sz = 1 + r() * 3.2, sway = 20 + r() * 50, f = .3 + r() * 1.2
    const life = (t + ph) * sp
    const y = H + 40 - (life % (H + 120))
    const x = x0 + Math.sin((t + ph) * f) * sway
    const a = alpha * clamp(y / H) * (.4 + .6 * Math.abs(Math.sin((t + ph) * 2.3)))
    const gr = g.createRadialGradient(x, y, 0, x, y, sz * 4)
    gr.addColorStop(0, `rgba(${color[0]},${color[1]},${color[2]},${a})`); gr.addColorStop(1, 'rgba(0,0,0,0)')
    g.fillStyle = gr; g.fillRect(x - sz * 4, y - sz * 4, sz * 8, sz * 8)
  }
  g.restore()
}
function item(name, x, y, size, alpha = 1, rot = 0) {
  const im = images['item:' + name]; if (!im) return
  g.save(); g.globalAlpha = alpha; g.translate(x, y); g.rotate(rot)
  g.shadowColor = 'rgba(0,0,0,.8)'; g.shadowBlur = size * .15; g.shadowOffsetY = size * .05
  g.drawImage(im, -size / 2, -size / 2, size, size); g.restore()
}
function slotTile(x, y, s, alpha = 1) {
  g.save(); g.globalAlpha = alpha
  const im = images['ui:slot']; if (im) g.drawImage(im, x - s / 2, y - s / 2, s, s)
  g.restore()
}
function flash(a, color = '255,240,200') { if (a <= 0) return; g.fillStyle = `rgba(${color},${clamp(a)})`; g.fillRect(0, 0, W, H) }

// ---- Scenes -------------------------------------------------------------------
// Bars: 0-3 title, 4-7 Taiar, 8-15 skills, 16-18 the count, 19-22 the world,
// 23-25 setting out, 26-27 the tear, 28-33 what lives here, 34-37 through the
// tear, 38+ the end card.

function sceneTitle(t) {
  stoneBackdrop(t, .7)
  const u = (t - bar(0)) / (bar(4) - bar(0))
  // a slow push in on the light
  const lg = g.createRadialGradient(W / 2, H / 2 + 20, 0, W / 2, H / 2, 700 + 200 * u)
  lg.addColorStop(0, `rgba(201,140,60,${.28 + .1 * beatPulse(t)})`); lg.addColorStop(1, 'rgba(0,0,0,0)')
  g.fillStyle = lg; g.fillRect(0, 0, W, H)
  embers(t, 90)
  const a = easeOut((t - bar(0)) / 1.2)
  const scale = lerp(1.25, 1, easeOut((t - bar(0)) / 2.5))
  g.save(); g.translate(W / 2, H / 2 - 30); g.scale(scale, scale)
  goldText('Talaran', 0, 0, 230, { weight: 700, spacing: 18, alpha: a, glow: .6 + .4 * barPulse(t) })
  g.restore()
  const lineA = easeOut((t - bar(1)) / .8)
  g.save(); g.globalAlpha = lineA
  const lw = 520 * lineA
  const gr = g.createLinearGradient(W / 2 - lw, 0, W / 2 + lw, 0)
  gr.addColorStop(0, 'rgba(201,161,74,0)'); gr.addColorStop(.5, 'rgba(228,192,106,1)'); gr.addColorStop(1, 'rgba(201,161,74,0)')
  g.fillStyle = gr; g.fillRect(W / 2 - lw, H / 2 + 105, lw * 2, 2); g.restore()
  plainText('A medieval skilling world, in your browser', W / 2, H / 2 + 160, 44, { italic: true, weight: 400, alpha: easeOut((t - bar(2)) / 1) })
  vignette(.9)
  flash(.5 * Math.exp(-(t - bar(0)) * 3))
}

function sceneTaiar(t) {
  const s = bar(4), e = bar(8)
  const u = (t - s) / (e - s)
  g.fillStyle = '#05080c'; g.fillRect(0, 0, W, H)
  // the island map, drifting
  g.save()
  const z = lerp(1.05, 1.35, easeInOut(u))
  cover(images['map:taiar'], 0, 0, W, H, z, lerp(.35, .6, u), lerp(.6, .4, u))
  g.restore()
  g.fillStyle = 'rgba(5,6,8,.35)'; g.fillRect(0, 0, W, H)
  vignette(.95)
  { const bg = g.createLinearGradient(0, H / 2 - 160, 0, H / 2 + 140); bg.addColorStop(0, 'rgba(0,0,0,0)'); bg.addColorStop(.3, 'rgba(0,0,0,.65)'); bg.addColorStop(.7, 'rgba(0,0,0,.65)'); bg.addColorStop(1, 'rgba(0,0,0,0)'); g.save(); g.globalAlpha = window_(t, s, e, .4, .3); g.fillStyle = bg; g.fillRect(0, H / 2 - 160, W, 300); g.restore() }
  goldText('Begin on Taiar Island', W / 2, H / 2 - 40, 110, { weight: 700, spacing: 6, alpha: window_(t, s + .1, e, .5, .3) })
  plainText('Twelve towns and wild places. A boat, when you are ready for it.', W / 2, H / 2 + 50, 40, { italic: true, weight: 400, alpha: window_(t, bar(5), e, .6, .3) })
  goldFrame(70, 70, W - 140, H - 140, .9)
}

function sceneSkills(t) {
  stoneBackdrop(t, .62)
  embers(t, 40, [228, 150, 60], 1.3, .7)
  const start = bar(8), half = BAR / 2
  const i = clamp(Math.floor((t - start) / half), 0, SKILLS.length - 1)
  const lt = t - (start + i * half)
  const [name, line, items] = SKILLS[i]
  // the frame stays, the content snaps
  const fx = W / 2 - 520, fy = H / 2 - 300, fw = 1040, fh = 600
  g.save(); g.globalAlpha = .9; nineSlice(images['ui:frame-stone'], fx, fy, fw, fh, 20, 20, false); g.restore()
  g.fillStyle = 'rgba(10,10,10,.55)'; g.fillRect(fx + 20, fy + 20, fw - 40, fh - 40)
  goldFrame(fx - 14, fy - 14, fw + 28, fh + 28)
  const pop = backOut(lt / .28)
  const sk = images['skill:' + name]
  // items orbiting behind the icon
  items.forEach((it, k) => {
    const ang = -Math.PI / 2 + (k === 0 ? -0.9 : 0.9) + lt * .5 * (k ? 1 : -1)
    item(it, W / 2 + Math.cos(ang) * 300 * pop, H / 2 - 70 + Math.sin(ang) * 120 * pop + 60, 150, .9 * clamp(lt / .2), (k ? .2 : -.2))
  })
  slotTile(W / 2, H / 2 - 70, 230 * pop)
  if (sk) { g.save(); g.translate(W / 2, H / 2 - 70); g.scale(pop, pop); g.shadowColor = 'rgba(228,192,106,.6)'; g.shadowBlur = 40; g.drawImage(sk, -90, -90, 180, 180); g.restore() }
  goldText(name, W / 2, H / 2 + 125, 92, { weight: 700, spacing: 4, alpha: clamp(lt / .12) })
  plainText(line, W / 2, H / 2 + 200, 40, { italic: true, weight: 400, alpha: clamp((lt - .08) / .15) })
  // a tally of the sixteen
  for (let k = 0; k < SKILLS.length; k++) {
    const x = W / 2 + (k - 7.5) * 46, y = H - 110
    g.fillStyle = k <= i ? (k === i ? '#f5dc94' : '#c9a14a') : '#333'
    g.beginPath(); g.arc(x, y, k === i ? 8 : 5, 0, Math.PI * 2); g.fill()
  }
  vignette(.8)
  flash(.08 * Math.exp(-lt * 10), '228,192,106')
}

function sceneCount(t) {
  stoneBackdrop(t, .7)
  embers(t, 60)
  // every skill icon in a ring, closing in
  const s = bar(16), u = (t - s) / (bar(19) - s)
  const R = lerp(1000, 560, easeOut(u * 1.6))
  SKILLS.forEach(([name], k) => {
    const ang = k / SKILLS.length * Math.PI * 2 + t * .25
    const x = W / 2 + Math.cos(ang) * R * 1.25, y = H / 2 + Math.sin(ang) * R * .62
    slotTile(x, y, 110, .9)
    const im = images['skill:' + name]; if (im) g.drawImage(im, x - 40, y - 40, 80, 80)
  })
  goldText('Sixteen skills', W / 2, H / 2 - 50, 130, { weight: 700, spacing: 6, alpha: easeOut((t - s) / .4) })
  plainText('No classes. No energy bar. Level one to a hundred, your way.', W / 2, H / 2 + 50, 42, { italic: true, weight: 400, alpha: easeOut((t - bar(17)) / .5) })
  vignette(.9)
  flash(.35 * Math.exp(-(t - s) * 4))
}

function sceneWorld(t) {
  // the break: calmer, parchment and items
  g.fillStyle = '#0c0b09'; g.fillRect(0, 0, W, H)
  tile(images['ui:bricks'], .35, 1.8, t * 4, 0)
  g.fillStyle = 'rgba(0,0,0,.55)'; g.fillRect(0, 0, W, H)
  embers(t, 30, [228, 170, 90], .6, .6)
  const s = bar(19)
  const i = clamp(Math.floor((t - s) / BAR), 0, WORLD.length - 1)
  const lt = t - (s + i * BAR)
  const [title, items] = WORLD[i]
  const a = clamp(lt / .3) * clamp((BAR - lt) / .25)
  // parchment card
  const cw = 1200, ch = 520, cx = W / 2 - cw / 2, cy = H / 2 - ch / 2 + 10
  g.save(); g.globalAlpha = a
  nineSlice(images['ui:parchment'], cx, cy, cw, ch, 26, 26, true)
  g.restore()
  goldFrame(cx - 12, cy - 12, cw + 24, ch + 24, a)
  goldText(title, W / 2, cy + 110, 76, { weight: 700, color: '#3a2a14', glow: 0, alpha: a })
  items.forEach((it, k) => {
    const d = k * .07
    const p = backOut((lt - d) / .35)
    const x = W / 2 + (k - 2.5) * 175, y = cy + 320
    slotTile(x, y, 150 * clamp(p), a)
    item(it, x, y - 4 * Math.sin(t * 3 + k), 118 * clamp(p, 0, 1.2), a)
  })
  vignette(.85)
}

function sceneSail(t) {
  const s = bar(23), e = bar(26)
  const u = (t - s) / (e - s)
  g.fillStyle = SEA; g.fillRect(0, 0, W, H)
  // two maps side by side, the camera travels from one to the other
  const mw = 1080, gap = 80
  const camX = lerp(0, mw + gap, easeInOut(u))
  const z = 0.95
  g.save(); g.translate(W / 2 - mw / 2 * z - camX * z + 200, H / 2 - mw / 2 * z); g.scale(z, z)
  if (soft.taiar) g.drawImage(soft.taiar, 0, 0, mw, mw)
  if (soft.antura) g.drawImage(soft.antura, mw + gap, 0, mw, mw)
  // the crossing: a dotted route drawn as we go
  g.strokeStyle = 'rgba(245,220,148,.95)'; g.lineWidth = 6; g.setLineDash([2, 18]); g.lineCap = 'round'
  g.beginPath()
  const x0 = mw * .72, y0 = mw * .3, x1 = mw + gap + mw * .3, y1 = mw * .62
  const steps = 60, upto = Math.floor(steps * clamp((u - .1) / .7))
  for (let k = 0; k <= upto; k++) { const q = k / steps; const x = lerp(x0, x1, q), y = lerp(y0, y1, q) - Math.sin(q * Math.PI) * 220; k ? g.lineTo(x, y) : g.moveTo(x, y) }
  g.stroke(); g.setLineDash([])
  g.restore()
  g.fillStyle = 'rgba(0,0,0,.25)'; g.fillRect(0, 0, W, H)
  vignette(.95)
  goldText('Then set out.', W / 2, 150, 96, { weight: 700, spacing: 4, alpha: window_(t, s, e, .5, .3) })
  plainText('Sail to Antura and the islets beyond.', W / 2, H - 140, 42, { italic: true, weight: 400, alpha: window_(t, bar(24), e, .5, .3) })
  // the pickup into the drop: the light goes wrong
  const wrong = clamp((t - bar(25)) / BAR)
  g.fillStyle = `rgba(40,0,10,${wrong * .6})`; g.fillRect(0, 0, W, H)
}

// The tear: a jagged rift across the sky, purple and red.
const TEAR = (() => { const r = rng(42); const pts = []; let y = 0, v = 0; for (let k = 0; k <= 48; k++) { v = v * .6 + (r() - .5) * .018; y = y * .92 + v; pts.push([k / 48, y + Math.sin(k / 48 * Math.PI * 1.2) * .035]) } return pts })()
function drawTear(cx, cy, len, open, t) {
  if (open <= 0) return
  g.save(); g.translate(cx, cy); g.rotate(-.18)
  const L = len * clamp(open * 1.6)
  const wid = 10 + 95 * easeOut(open)
  const path = (wscale) => {
    g.beginPath()
    TEAR.forEach(([x, y], k) => { const px = (x - .5) * L, py = y * len; const w = Math.pow(Math.sin(x * Math.PI), 1.6) * wid * wscale * (1 + .1 * Math.sin(t * 5 + k * .7)); k ? g.lineTo(px, py - w) : g.moveTo(px, py - w) })
    for (let k = TEAR.length - 1; k >= 0; k--) { const [x, y] = TEAR[k]; const px = (x - .5) * L, py = y * len; const w = Math.pow(Math.sin(x * Math.PI), 1.6) * wid * wscale * (1 + .1 * Math.cos(t * 4 + k * .9)); g.lineTo(px, py + w) }
    g.closePath()
  }
  g.globalCompositeOperation = 'lighter'
  g.shadowColor = 'rgba(170,60,255,1)'; g.shadowBlur = 120
  path(2.2); g.fillStyle = 'rgba(90,20,160,.30)'; g.fill()
  g.shadowColor = 'rgba(255,70,40,1)'; g.shadowBlur = 50
  path(1.15); g.fillStyle = 'rgba(230,90,60,.5)'; g.fill()
  path(.95); g.fillStyle = 'rgba(255,220,200,.55)'; g.fill()
  g.globalCompositeOperation = 'source-over'; g.shadowBlur = 0
  path(.7); const gr = g.createLinearGradient(0, -wid, 0, wid); gr.addColorStop(0, '#12001c'); gr.addColorStop(.5, '#000'); gr.addColorStop(1, '#1c0006'); g.fillStyle = gr; g.fill()
  // stars on the other side
  g.save(); path(.7); g.clip()
  const r = rng(3); for (let k = 0; k < 60; k++) { const x = (r() - .5) * L, y = (r() - .5) * wid * 1.4; g.fillStyle = `rgba(255,220,255,${.3 + .7 * Math.abs(Math.sin(t * 3 + k))})`; g.fillRect(x, y, 2, 2) }
  g.restore()
  g.restore()
}
function skyBackdrop(t, red = 1) {
  g.fillStyle = '#060306'; g.fillRect(0, 0, W, H)
  g.save(); g.globalAlpha = .55 * red; cover(images['ui:red'], 0, 0, W, H, 1.1 + .03 * Math.sin(t * .5)); g.restore()
  g.fillStyle = 'rgba(0,0,0,.45)'; g.fillRect(0, 0, W, H)
}

function sceneTearOpens(t) {
  const s = bar(26)
  const shake = 14 * Math.exp(-(t - s) * 3) + 4 * beatPulse(t)
  g.save(); g.translate((Math.sin(t * 91) * shake), (Math.cos(t * 77) * shake))
  skyBackdrop(t)
  drawTear(W / 2, H / 2 - 40, 1500, (t - s) / (BAR * 2), t)
  embers(t, 80, [200, 80, 255], 1.6, .9)
  g.restore()
  vignette(.9)
  goldText('The sky is tearing.', W / 2, H - 170, 96, { weight: 700, spacing: 4, alpha: window_(t, s + .3, bar(28), .4, .2), color: '#f2e2c8' })
  flash(.9 * Math.exp(-(t - s) * 4), '255,230,255')
}

function sceneCreatures(t) {
  const s = bar(28), half = BAR / 2
  const i = clamp(Math.floor((t - s) / half), 0, CREATURES.length - 1)
  const lt = t - (s + i * half)
  const shake = 18 * Math.exp(-lt * 9)
  g.save(); g.translate(Math.sin(t * 97) * shake, Math.cos(t * 83) * shake)
  skyBackdrop(t, .8)
  drawTear(W / 2, 170, 1700, 1, t)
  const k = CREATURES[i], im = images['beast:' + k]
  const p = backOut(lt / .25)
  if (im) {
    g.save(); g.translate(W / 2 + (i % 2 ? 1 : -1) * 260, H / 2 + 90); g.scale(p * 2.6, p * 2.6)
    g.shadowColor = 'rgba(255,60,40,.6)'; g.shadowBlur = 50
    g.drawImage(im, -128, -128, 256, 256); g.restore()
  }
  const nx = W / 2 + (i % 2 ? -1 : 1) * 420
  goldText(CREATURE_NAMES[k] || k.replace(/_/g, ' '), nx, H / 2 + 40, 84, { weight: 700, spacing: 3, alpha: clamp(lt / .1) })
  embers(t, 50, [255, 110, 60], 1.4, .8)
  g.restore()
  vignette(.85)
  goldText('Fight what walks the islands', W / 2, H - 90, 46, { weight: 600, italic: false, alpha: .85, glow: .3 })
  flash(.35 * Math.exp(-lt * 12), '255,120,90')
}

function sceneThrough(t) {
  const s = bar(34), e = bar(38)
  const u = (t - s) / (e - s)
  skyBackdrop(t, 1)
  drawTear(W / 2, H / 2 - 120, 1800, 1 + .2 * barPulse(t), t)
  { const fg = g.createRadialGradient(W / 2, H / 2 + 120, 50, W / 2, H / 2 + 120, 1000); fg.addColorStop(0, `rgba(150,60,200,${.55 + .2 * barPulse(t)})`); fg.addColorStop(.6, 'rgba(90,20,120,.25)'); fg.addColorStop(1, 'rgba(0,0,0,0)'); g.save(); g.globalCompositeOperation = 'lighter'; g.fillStyle = fg; g.fillRect(0, 0, W, H); g.restore() }
  // shapes coming through, black against the light
  SILHOUETTES.forEach((k, j) => {
    const c = shadows[k]; if (!c) return
    const d = j * BAR * .5
    const q = clamp((t - s - d) / (BAR * 1.6))
    if (q <= 0) return
    const x = W / 2 + (j - 2.5) * 300 + Math.sin(j * 7) * 40
    const y = lerp(H / 2 - 120, H / 2 + 220 + (j % 2) * 60, easeOut(q))
    const sc = lerp(.3, 1.6, easeOut(q))
    g.save(); g.globalAlpha = clamp(q * 3); g.translate(x, y); g.scale(sc, sc)
    g.shadowColor = 'rgba(200,60,255,.9)'; g.shadowBlur = 40
    g.drawImage(c, -128, -128, 256, 256)
    // eyes
    g.shadowColor = 'rgba(255,40,30,1)'; g.shadowBlur = 20; g.fillStyle = '#ff5a3c'
    g.fillRect(-30, -50, 6, 4); g.fillRect(-12, -52, 6, 4)
    g.restore()
  })
  embers(t, 90, [200, 80, 255], 2, 1)
  vignette(.9)
  goldText('The Bronze Shore. Annwn.', W / 2, 150, 84, { weight: 700, spacing: 4, alpha: window_(t, s, bar(36), .3, .3), color: '#f2e2c8' })
  goldText('Stand at the tear. Hold the line.', W / 2, 150, 84, { weight: 700, spacing: 4, alpha: window_(t, bar(36), e, .3, .15) })
  flash(.5 * Math.exp(-(t - s) * 5), '230,200,255')
}

function sceneEnd(t) {
  const s = bar(38)
  stoneBackdrop(t, .72)
  const lg = g.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, 900)
  lg.addColorStop(0, `rgba(201,140,60,${.3 + .15 * barPulse(t)})`); lg.addColorStop(1, 'rgba(0,0,0,0)')
  g.fillStyle = lg; g.fillRect(0, 0, W, H)
  embers(t, 110)
  const fw = 1300, fh = 640
  const fa = easeOut((t - s) / .6)
  g.save(); g.globalAlpha = fa * .8; g.fillStyle = 'rgba(8,8,8,.7)'; g.fillRect(W / 2 - fw / 2 + 20, H / 2 - fh / 2 + 20, fw - 40, fh - 40); g.restore()
  goldFrame(W / 2 - fw / 2, H / 2 - fh / 2, fw, fh, fa)
  const sc = lerp(1.15, 1, easeOut((t - s) / 1.5))
  g.save(); g.translate(W / 2, H / 2 - 110); g.scale(sc, sc)
  goldText('Talaran', 0, 0, 200, { weight: 700, spacing: 16, alpha: fa, glow: .6 + .4 * barPulse(t) })
  g.restore()
  goldText('Version 1.0', W / 2, H / 2 + 30, 64, { weight: 600, spacing: 10, alpha: easeOut((t - bar(39)) / .4) })
  plainText('Free to play in your browser. No download.', W / 2, H / 2 + 115, 42, { italic: true, weight: 400, alpha: easeOut((t - bar(40)) / .5) })
  goldText('talaran.net', W / 2, H / 2 + 215, 60, { weight: 700, spacing: 4, alpha: easeOut((t - bar(41) - .1) / .5), glow: 1 })
  vignette(.9)
  flash(.6 * Math.exp(-(t - s) * 3))
  // credit and fade to black
  plainText('Music: "Celtic Impulse" by Kevin MacLeod (incompetech.com), CC BY 4.0', W / 2, H - 50, 22, { alpha: .55 * easeOut((t - bar(42)) / 1), weight: 500 })
  const out = clamp((t - (DURATION - 2)) / 2)
  if (out > 0) { g.fillStyle = `rgba(0,0,0,${out})`; g.fillRect(0, 0, W, H) }
}

const SCENES = [
  [0, bar(4), sceneTitle],
  [bar(4), bar(8), sceneTaiar],
  [bar(8), bar(16), sceneSkills],
  [bar(16), bar(19), sceneCount],
  [bar(19), bar(23), sceneWorld],
  [bar(23), bar(26), sceneSail],
  [bar(26), bar(28), sceneTearOpens],
  [bar(28), bar(34), sceneCreatures],
  [bar(34), bar(38), sceneThrough],
  [bar(38), 999, sceneEnd],
]
const DURATION = 76

function render(t) {
  g.save()
  g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; g.globalCompositeOperation = 'source-over'; g.shadowBlur = 0
  const sc = SCENES.find(([s, e]) => t >= s && t < e) || SCENES[SCENES.length - 1]
  sc[2](t)
  // a hard cut gets one frame of black at each scene start for punch
  g.restore()
}
window.render = render
window.DURATION = DURATION

// ---- Live preview -------------------------------------------------------------
window.ready = loadAll().then(() => {
  render(0)
  if (new URLSearchParams(location.search).has('render')) return
  const music = document.getElementById('music'), btn = document.getElementById('play')
  const tParam = Number(new URLSearchParams(location.search).get('t') || 0)
  btn.hidden = false
  btn.onclick = () => { btn.hidden = true; music.currentTime = tParam; music.play(); const loop = () => { render(music.currentTime); if (!music.paused) requestAnimationFrame(loop) }; loop() }
})
</script>
