# A copy of /etc/nginx/sites-enabled/talaran on the box, as it stood on
# 2026-11-10. The box's file is the one nginx reads; when it changes, change
# this copy too, or a rebuilt server comes up without the change.
# Test and reload on the box with:  nginx -t && systemctl reload nginx
server {
    server_name talaran.net www.talaran.net;
    include snippets/talaran-security-headers.conf;

    location / {
        root /var/www/talaran/apps/client/dist;
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        root /var/www/talaran/apps/client/dist;
        add_header Cache-Control "no-cache" always;
        # An add_header in a location replaces every add_header set above it,
        # so the security headers are named again here or this page loses them.
        include snippets/talaran-security-headers.conf;
    }

    location ~ ^/api {
        client_max_body_size 5m;
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    location ~ ^/socket.io {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/talaran.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/talaran.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = www.talaran.net) {
        return 301 https://$host$request_uri;
    }
    if ($host = talaran.net) {
        return 301 https://$host$request_uri;
    }
    listen 80;
    server_name talaran.net www.talaran.net;
    return 404;
}
